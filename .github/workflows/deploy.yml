name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails the build if a real .env ever gets committed. The publishable keys
      # in VITE_SUPABASE_* are meant to be public, so this only catches files
      # holding the server-side provider keys.
      - name: Fail if a .env file is tracked
        shell: pwsh
        run: |
          $tracked = git ls-files | Where-Object { $_ -match '(^|/)\.env($|\.)' -and $_ -ne '.env.example' }
          if ($tracked) {
            Write-Error "Tracked env file(s): $($tracked -join ', '). Commit to .gitignore instead."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the two VITE_ values are exposed to the bundle, and both are public
      # by design: the project URL and the publishable key. Without these the
      # Pages build ships with Supabase disabled and runs local-only.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
